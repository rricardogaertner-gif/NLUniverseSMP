
name: Build NLUniverseSMP

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: cache-dependency-path: NLUniverseSMP/pom.xml

      - name: Build NLUniverseSMP
        run: run: mvn -B clean package --file NLUniverseSMP/pom.xml

      - name: Upload plugin JAR
        uses: actions/upload-artifact@v4
        with:
          name: NLUniverseSMP
          path: path: NLUniverseSMP/target/*.jar
          if-no-files-found: error
