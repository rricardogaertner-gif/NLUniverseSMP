worlds:
  overworld: smp
  nether: smp_nether
  end: smp_the_end
hub:
  world: nluniverse_hub
  x: 0.5
  y: 80.0
  z: 0.5
  yaw: 0.0
  pitch: 0.0
hardcore-cooldown-hours: 24
season-days: 14
# Safety: automatic wipes must be explicitly enabled.
automatic-season-wipe: false
world-border-diameter: 10000
pvp: true
# Existing worlds are NEVER automatically wiped on first installation.
# Run /nlsmp wipe confirm only after making your own off-server backup.
backup:
  enabled: true
  directory: smp-season-backups
  keep: 3
supply-drops:
  enabled: true
  interval-minutes: 60
  despawn-minutes: 45
  god-tier-chance: 0.01
  minimum-radius: 200
  maximum-radius: 4500
  attempts: 35
  announce-coordinates: true
limits:
  totems: 1
  ender-pearls: 64
